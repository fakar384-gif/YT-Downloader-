<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro YouTube Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pro YT Downloader</h1>
        <p>Download your favorite videos in high quality</p>
    </header>

    <div class="ad-unit">
        <p>AdSense Ad Unit (Top)</p>
    </div>

    <main class="tool-container">
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL here...">
            <button id="fetchBtn">Fetch Video</button>
        </div>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Processing video... Please wait.</p>
        </div>

        <div id="result" class="hidden">
            <div class="video-info">
                <img id="thumbnail" src="" alt="Video Thumbnail">
                <h3 id="videoTitle">Video Title Goes Here</h3>
            </div>
            
            <div class="download-options">
                <h4>Download Links</h4>
                <div class="btn-group">
                    <button class="download-btn video">Download MP4 (720p)</button>
                    <button class="download-btn audio">Download MP3 (Audio)</button>
                </div>
            </div>
        </div>
    </main>

    <div class="ad-unit">
        <p>AdSense Ad Unit (Bottom)</p>
    </div>

    <footer>
        <p>&copy; 2026 Pro YT Downloader. All rights reserved.</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a> | <a href="#">Terms of Service</a> | <a href="#">Contact Us</a>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
